name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Upload built portable helpers
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-helpers
          path: |
            skills/sloppyai/scripts/sloppyai.mjs
            skills/sloppyai/scripts/core.mjs
            skills/sloppyai/scripts/THIRD_PARTY_LICENSES.md
          retention-days: 1
      - run: npm audit --audit-level=moderate
      - run: npm pack
      - run: npm run package:smoke

  rendered-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Select the installed Playwright Chromium
        run: node -e "console.log('SLOPPYAI_CHROMIUM=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - run: node --test test/runtime.test.mjs
        env:
          SLOPPYAI_REQUIRE_BROWSER: '1'
      - run: npm run build
      - run: node scripts/rendered-demo.mjs .sloppyai/workroom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: workroom-rendered-review
          path: .sloppyai/workroom
          include-hidden-files: true
          retention-days: 7
