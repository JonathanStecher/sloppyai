<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Authored application review fixture</title></head>
<body>
  <main>
    <h1>Review a document export</h1>
    <p>This is a static review fixture, not a connected application.</p>
    <form>
      <label for="name">Export name</label>
      <input id="name" name="name" value="Quarterly report">
      <button type="submit">Export document</button>
      <button type="button">Cancel</button>
    </form>
    <section aria-labelledby="states"><h2 id="states">States to assess in a connected implementation</h2>
      <ul><li>Waiting for export.</li><li>Export failed with safe retry.</li><li>Export ready to download.</li></ul>
    </section>
  </main>
</body></html>
